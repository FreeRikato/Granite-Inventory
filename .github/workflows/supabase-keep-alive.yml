name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        project: [STAGING]
    steps:
      - name: Read v_public_business
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_{0}_URL', matrix.project)] }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets[format('SUPABASE_{0}_PUBLISHABLE_KEY', matrix.project)] }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
            "$SUPABASE_URL/rest/v1/v_public_business?select=business_name&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
